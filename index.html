<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<title>SteamIDManager</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0f1318;--top:#0f1318;--card:#141a21;--inner:#19212a;--raised:#1f2833;--field:#0b0f13;--line:rgba(199,213,224,.11);--line2:rgba(199,213,224,.24);
  --fg:#d7e3ec;--fg2:#a3b2bf;--mut:#8896a4;--ink:#0b1117;
  --acc:#66c0f4;--pos:#5ec98f;--neg:#ee6a6e;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/20px var(--sans)}
.app{max-width:880px;margin:0 auto;padding:24px 32px 48px;display:flex;flex-direction:column;gap:16px}

header{background:var(--top);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.35)}
header .in{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:880px;height:64px;margin:0 auto;padding:0 32px}
h1{display:flex;align-items:center;gap:12px;margin:0;font-size:24px;line-height:32px;font-weight:500;letter-spacing:.2px}
.logo{flex:none;width:36px;height:36px}
.top{display:flex;align-items:center;gap:8px}
.lang{display:flex;gap:2px;padding:2px;background:var(--field);border:1px solid var(--line);border-radius:8px}
.lang button{width:40px;height:28px;border:0;border-radius:6px;background:none;color:var(--mut);font:500 12px var(--sans);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.lang button:hover{color:var(--fg)}
.lang button[aria-pressed=true]{background:var(--raised);color:var(--fg)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card .card{background:var(--inner);border-radius:10px;padding:16px}
.card h2{margin:0;font-size:16px;line-height:24px;font-weight:500}
#swp{display:flex;flex-direction:column;gap:16px}
.cap{margin:0 0 16px;font-size:12px;line-height:16px;color:var(--mut)}
.field{margin-top:12px}
label{display:block;margin-bottom:4px;font-size:12px;line-height:16px;color:var(--fg2)}
.hint{margin-top:4px;font-size:12px;line-height:16px;color:var(--mut)}
input{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--fg);font:14px var(--sans);transition:border-color .15s var(--ease)}
input:hover{border-color:var(--line2)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pre{display:flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--field);transition:border-color .15s var(--ease)}
.pre:hover{border-color:var(--line2)}
.pre:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.pre span{padding-left:12px;font:12px var(--mono);color:var(--mut);white-space:nowrap}
.pre input{border:0;background:none;padding:0 12px 0 0;font-family:var(--mono);font-size:13px;outline:0}

/* the swap: who gives, which ID moves, who receives */
.flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:16px 0;padding:16px;background:var(--field);border:1px solid var(--line);border-radius:8px}
.node{display:flex;align-items:center;gap:8px;min-width:0}
.node.r{justify-content:flex-end}
.who{display:flex;flex-direction:column;min-width:0}
.node.r .who{align-items:flex-end}
.who b,.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.who b{font-weight:400}
.who small{font:12px/16px var(--mono);color:var(--mut)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:32px}
.btn.sm{height:32px;padding:0 12px;border-radius:6px;font-size:13px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);transition:background-color .3s var(--ease)}
.dot.on{background:var(--acc);box-shadow:none}.dot.done{background:var(--pos);box-shadow:none}
.link{position:relative;display:flex;align-items:center;justify-content:center;min-width:200px}
.link::before{content:"";position:absolute;left:0;right:8px;top:50%;height:1px;background:var(--line)}
.link::after{content:"";position:absolute;right:0;top:50%;width:6px;height:6px;margin-top:-3px;border-top:1px solid var(--mut);border-right:1px solid var(--mut);transform:rotate(45deg)}
.chip{position:relative;max-width:100%;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--raised);font:12px/16px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .3s var(--ease)}
.chip.done{border-color:var(--pos)}.chip i{font-style:normal;color:var(--mut)}
.move{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 16px;padding:12px 16px;border:1px solid rgba(102,192,244,.4);border-radius:10px;background:var(--raised);font:13px/20px var(--sans);color:var(--fg2)}
.move code{font:500 15px/20px var(--mono);color:var(--fg)}
.move code.auto{font:13px/20px var(--sans);color:var(--mut)}
.move.done{border-color:var(--pos)}
.lose{flex-basis:100%;font-size:12px;line-height:16px;color:var(--neg)}

.bar{display:flex;align-items:center;gap:16px}
.bar p{margin:0;font-size:12px;line-height:16px;color:var(--mut)}
.btn{white-space:nowrap;height:40px;padding:0 20px;border:0;border-radius:6px;background:#3f9fd6;color:var(--ink);font:500 14px var(--sans);cursor:pointer;transition:background-color .15s var(--ease),transform .15s var(--ease),opacity .15s var(--ease)}
.btn:hover{background:#5bb3e6}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.sec{background:var(--raised);color:var(--fg);border:1px solid var(--line)}.btn.sec:hover{background:#28333f}

.btns{display:flex;flex-wrap:wrap;gap:8px}
#prog{margin:12px 0 0;font:12px/16px var(--mono);color:var(--fg2)}
#guard{display:none;border-color:rgba(102,192,244,.4)}
#guard .row{display:flex;gap:12px;margin-top:12px}
#guard input{font-family:var(--mono);letter-spacing:.1em}

.est{display:flex;align-items:flex-start;gap:16px;margin:0 0 16px}
.estt{display:flex;flex-direction:column;gap:2px;min-width:0;font:12px/20px var(--mono);color:var(--fg2)}
.estt p{margin:0}.estt .e{color:var(--neg)}
.sl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 16px}
@media(max-width:760px){.sl{grid-template-columns:1fr}}
.sl label{display:flex;justify-content:space-between;gap:8px}.sl b{font:12px/16px var(--mono);color:var(--fg);font-weight:400}
input[type=range]{height:20px;padding:0;border:0;background:none;accent-color:var(--acc);cursor:pointer}
.log{flex:none;display:flex;flex-direction:column}
.log h2{margin-bottom:12px}
#log{height:288px;overflow:auto;font:12px/20px var(--mono);color:var(--fg2)}
#log div{display:flex;gap:12px}#log time{flex:none;color:var(--mut)}
#log .ok{color:var(--pos)}#log .bad{color:var(--neg)}
#foot{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;gap:12px;align-items:center;height:32px;padding:0 32px;background:var(--card);border-top:1px solid var(--line);font:12px/20px var(--mono);color:var(--fg2);cursor:pointer;white-space:nowrap;overflow:hidden}
#foot.show{display:flex}#foot time{flex:none;color:var(--mut)}#foot span{overflow:hidden;text-overflow:ellipsis}
#foot .ok{color:var(--pos)}#foot .bad{color:var(--neg)}
#helpDlg{width:min(640px,calc(100% - 32px));max-height:calc(100% - 64px);padding:20px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--fg);overflow:auto}
#helpDlg h2{margin:0;font-size:16px;line-height:24px;font-weight:500}
#helpDlg::backdrop{background:rgba(0,0,0,.65)}
#helpBody h3{margin:20px 0 4px;font-size:14px;line-height:20px;font-weight:500;color:var(--acc)}
#helpBody p{margin:4px 0 0;font-size:13px;line-height:20px;color:var(--fg2)}
.ver{display:flex;align-items:center;justify-content:space-between;gap:16px;font:12px/16px var(--sans);color:var(--mut)}
.ver label{display:flex;align-items:center;gap:8px;margin:0;color:var(--fg2);cursor:pointer}
.ver input{width:16px;height:16px;padding:0;accent-color:var(--acc);cursor:pointer}
#empty{color:var(--mut);font:13px/20px var(--sans)}
textarea{width:100%;min-height:72px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--fg);font:13px/20px var(--mono);resize:vertical;transition:border-color .15s var(--ease)}
textarea:hover{border-color:var(--line2)}textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#mList{max-height:312px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.sub{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.sub h3{margin:0;font-size:14px;line-height:20px;font-weight:500}
.ar{display:grid;grid-template-columns:20px minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1fr) 200px;align-items:center;gap:12px;min-height:44px;padding:4px 12px;border-bottom:1px solid var(--line);font-size:13px}
.ar:last-child{border-bottom:0}
.ar.h .s{padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;white-space:nowrap}.ar.h .s:hover{color:var(--fg)}
.ar.h{position:sticky;top:0;z-index:1;min-height:32px;background:var(--card);font-size:12px;color:var(--mut)}
.ar input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--acc);cursor:pointer}
.ar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar .m{font:12px/16px var(--mono);color:var(--fg2)}
.ar small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px;color:var(--mut)}
.ar small.e{color:var(--neg)}
.ar.none{display:block;color:var(--mut)}
.ar:not(.h):not(.none):not(.d){cursor:pointer}.ar:not(.h):not(.none):not(.d):hover{background:rgba(199,213,224,.05)}
.ar:has(+ .ar.d){border-bottom-color:transparent}
.ar .btns{flex-wrap:nowrap;justify-content:flex-end}
.ar.d{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:0;padding:4px 12px 12px 44px;background:rgba(199,213,224,.05);font:12px/20px var(--mono);color:var(--fg2);user-select:text}
.ar.d .x{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
@media(max-width:760px){.ar{grid-template-columns:20px minmax(0,1fr) auto}.ar .m,.ar.h>:nth-child(3),.ar.h>:nth-child(4){display:none}}
</style></head><body>

const H={
ru:[
['Swapper: обмен ID',['Введите логин и пароль аккаунта 1 (он сейчас владеет ID) и аккаунта 2 (он получит ID). Если добавить shared_secret, коды Steam Guard будут вводиться сами, иначе программа спросит код.','«Загрузить текущие ID» показывает, какие ID сейчас у аккаунтов. Аккаунт 1 получает временный ID (можно задать свой, иначе случайный), а его прежний ID переходит ко 2-му аккаунту. Прежний ID аккаунта 2 освобождается, его может занять кто угодно.','Сначала ID переносится, и только потом всё проверяется. После обмена, чтобы повторить, нажмите «Загрузить текущие ID». Пароли из этой карточки хранятся только в памяти.']],

['Поиск свободных ID',['Список ID лежит в ids.txt: по одному в строке или через запятую, регистр сохраняется. «Посчитать ID» показывает количество и примерное время.','«Искать и занимать» проверяет ID по очереди. Свободные пишутся в available.txt и сразу занимаются отмеченными аккаунтами без своего ID, кто что занял – в claimed.txt. Один аккаунт занимает один ID.','Ползунки: пауза между проверками (меньше 5 с Steam отвечает ошибкой 429), таймаут запроса и пауза после 429. Их можно менять во время поиска. Остановить поиск можно той же кнопкой.']],

  log.textContent='';

    tm.textContent=x.time;m.textContent=t(x.key,x.p)+(x.raw?': '+x.raw:'');
    if(x.cls)m.className=x.cls;
    row.append(tm,m);log.append(row);
  }
  log.scrollTop=atEnd?log.scrollHeight:keep;
}
// the last journal line, pinned to the bottom of the window while the journal itself is scrolled out of view
function foot(){
  const x=entries[entries.length-1],f=$('foot');
  f.querySelector('time').textContent=x?x.time:'';
  const m=f.querySelector('span');m.textContent=x?t(x.key,x.p)+(x.raw?': '+x.raw:''):'';m.className=x&&x.cls||'';
  f.dataset.has=x?'1':'';f.classList.toggle('show',!!x&&!seen);
}
let seen=true;
new IntersectionObserver(([e])=>{seen=e.isIntersecting;foot()},{rootMargin:'0px 0px -32px 0px'}).observe($('log'));
$('foot').onclick=()=>$('log').scrollIntoView({behavior:'smooth',block:'center'});
function flow(){
  $('n1').textContent=$('l1').value.trim()||t('acc')+' 1';
  $('n2').textContent=$('l2').value.trim()||t('acc')+' 2';
  [1,2].forEach(n=>$('i'+n).textContent=cur[n]?'/id/'+cur[n]:'');
  const id=moved||cur[1]; // the ID that moves: the one account 1 owns
  $('chip').replaceChildren(Object.assign(document.createElement('i'),{textContent:'/id/'}),document.createTextNode(id||'…'));
  $('mv').textContent=id?'/id/'+id:t('moveAuto');
  $('mv').className=id?'':'auto';
  $('lose').textContent=swapped||(loaded&&!cur[2])?'':cur[2]?t('loseId',{id:cur[2]}):t('loseAny');
}
function push(key,p,cls,raw){
  const d=new Date();
  // a long search must not slow the window down: the oldest line goes, noise (pauses, counts) before anything that matters
  if(entries.length>=500){const i=entries.findIndex(e=>['huntWait','huntUnknown','waitRate','huntLive'].includes(e.key));entries.splice(i<0?0:i,1)}
  entries.push({key,p,cls,raw,time:`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`});
  render();
}
// one journal line that keeps counting while the search runs; after another entry (a pause, a find) the next count starts a new line
function live(st){
  const last=entries[entries.length-1];
  if(last&&last.key==='huntLive'){
    last.p=st;
    const row=$('log').lastElementChild;
    if(row&&row.lastChild)row.lastChild.textContent=t('huntLive',st);
    foot();return;
  }
  push('huntLive',st);
}
const dot=(n,s)=>{$('d'+n).className='dot '+(s||'')};

api.onLog((key,p)=>{
  if(key==='accChecked')p={...p,id:p.id||'—'};
  push(key,p,['done','ready','found','claimed','huntDone','accChecked','refreshDone','idCleared','mgrExported'].includes(key)?'ok':['passWeak','noAccounts','huntLoginLimit','noLink','badConfig','badPass','retry','rollbackFail','noProfile','rateLimit','waitRate','firstFail','huntWait','huntUnknown','badIds','badAccounts','accHasId','accFail','noSpare','claimFail','accCooldown','fileFail','accCheckFail','accRateLimit','clearChanged','clearKept','accMissing'].includes(key)?'bad':'');
  if(key==='huntStart')live({checked:0,total:p.t,found:0,claimed:0}); // the line that then keeps counting
  if(key==='session'&&(p.n===1||p.n===2))dot(p.n,'on'); // the search names accounts by login
  if(key==='ready'){moved=p.target;flow()}
  if(key==='done'){dot(1,'done');dot(2,'done');$('chip').classList.add('done');$('move').classList.add('done')}
});
api.onAskCode((n,d,w)=>{guard={n,d,w};$('guard').style.display='block';$('gcap').textContent=gtext();$('code').value='';$('code').focus()});
function sendCode(){const v=$('code').value.trim();if(!v)return;api.sendCode(v);$('code').value='';hideGuard()}
$('send').onclick=sendCode;
$('skip').onclick=()=>{api.cancelCode();hideGuard()}; // this account is skipped, the others go on
$('code').onkeydown=e=>{if(e.key==='Enter')sendCode()};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set(lang);render();renderAcc()});
['l1','l2'].forEach(id=>$(id).addEventListener('input',flow));
['l1','p1','l2','p2'].forEach(id=>$(id).addEventListener('input',()=>{cur[1]=cur[2]='';moved='';swapped=loaded=false;$('go').disabled=busy;flow()})); // loaded IDs belong to the old logins

const creds=()=>({a1:{login:$('l1').value.trim(),password:$('p1').value,secret:$('s1').value.trim()},
  a2:{login:$('l2').value.trim(),password:$('p2').value,secret:$('s2').value.trim()}});
const fail=r=>{
  dot(1);dot(2);
  if(r.error.key)push(r.error.key,r.error.p||{},'bad');
  else push('err',{},'bad',(r.error.acc?t('acc')+' '+r.error.acc+': ':'')+r.error.msg);
};

const reset=()=>{entries.length=0;moved='';dot(1);dot(2);$('chip').classList.remove('done');$('move').classList.remove('done')};
$('load').onclick=async()=>{
  reset();lock(true);render();
  const r=await api.loadIds(creds());
  if(r&&r.ok)swapped=false; // fresh IDs are known, running again is safe
  lock(false);
  if(r&&r.error)fail(r);
  else if(r&&r.ok){cur[1]=r.result[1];cur[2]=r.result[2];loaded=true}
  render();
};

$('go').onclick=async()=>{
  if(!confirm([t('confirm'),cur[1]&&'/id/'+cur[1]+' → '+t('acc')+' 2',$('lose').textContent].filter(Boolean).join('\n')))return;
  reset();lock(true);render();
  const r=await api.start({...creds(),temp:$('temp').value.trim()});
  if(r&&r.ok)swapped=true;
  lock(false);
  if(r&&r.error)fail(r);
  else if(r&&r.ok){cur[1]=cur[2]='';loaded=false;push('again',{},'')} // IDs changed, loaded values are stale
  render();
};
// sliders: base pause between checks (tenths of a second), request timeout and first pause after a 429 (seconds); saved, and live during a run
const tuneKey='tune';
const tune=()=>({gap:$('rGap').value*100,timeout:$('rTimeout').value*1000,rateWait:$('rRate').value*1000});
function showTune(){
  $('vGap').textContent=($('rGap').value/10).toFixed(1)+' '+t('unit');
  $('vTimeout').textContent=$('rTimeout').value+' '+t('unit');
  $('vRate').textContent=$('rRate').value+' '+t('unit');
  showEst();
}
try{const v=JSON.parse(localStorage.getItem(tuneKey));if(v)['rGap','rTimeout','rRate'].forEach(k=>{if(Number.isFinite(+v[k]))$(k).value=v[k]})}catch{}
['rGap','rTimeout','rRate'].forEach(k=>$(k).addEventListener('input',()=>{
  showTune();
  try{localStorage.setItem(tuneKey,JSON.stringify({rGap:$('rGap').value,rTimeout:$('rTimeout').value,rRate:$('rRate').value}))}catch{}
  api.tuneHunt(tune());
}));
api.onProgress(st=>{prog=st;$('prog').textContent=t('huntProg',st);live(st)}); // not render(): it rebuilds the journal and scrolls it down
const openF=async k=>{const r=await api.openFile(k);if(r&&r.error)accErr(r)};
$('openIds').onclick=()=>openF('ids');
// update check: GitHub's latest release against this version; a newer one opens its page (the user downloads the exe), nothing is replaced by itself
let appVer='';
async function checkUpd(manual){
  const r=await api.updateCheck();
  if(r.error){if(manual)push('updFail',{},'bad',r.error.msg);return}
  const v=r.result;
  if(v.none){if(manual)push('updNone');return}
  if(v.newer){push('updNew',{v:v.tag});if(manual)api.openLink('update')}
  else if(manual)push('updLatest',{v:v.tag});
}
$('upd').onclick=()=>checkUpd(true);
$('help').onclick=()=>$('helpDlg').showModal();
$('helpX').onclick=()=>$('helpDlg').close();
$('helpDlg').onclick=e=>{if(e.target===$('helpDlg'))$('helpDlg').close()}; // a click on the dark area closes it
$('updAuto').checked=(()=>{try{return localStorage.getItem('updAuto')!=='0'}catch{return true}})();
$('updAuto').onchange=e=>{try{localStorage.setItem('updAuto',e.target.checked?'1':'0')}catch{}};
api.appInfo().then(i=>{appVer=i.version;render();if($('updAuto').checked)checkUpd(false)});
$('gh').onclick=async()=>{const r=await api.openLink('github');if(r&&r.error)accErr(r)};
$('openFound').onclick=()=>openF('found');
$('openClaimed').onclick=()=>openF('claimed');
// the search takes one request per ID, so the time is about count x pause; the pause is adaptive and grows after a 429, so this is the best case
let idCount=null; // {n, bad} after "Count IDs"
const dur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' '+t('unitH')+' '+m+' '+t('unitM'):m?m+' '+t('unitM')+' '+s%60+' '+t('unit'):s+' '+t('unit')};
function showEst(){
  const s=accs.filter(a=>a.use).length,n=accs.filter(a=>a.use&&!a.id).length; // an account that already has an ID is not used by the search
  $('hSel').textContent=accs.length?t(n<s?'hSelSkip':'hSel',{n:n<s?n:s,s,m:accs.length}):'';
  const c=$('hCount'),tm=$('hTime');
  c.textContent=idCount?(idCount.n?t('hCount',{n:idCount.n}):t('hNone'))+(idCount.bad?', '+t('hBad',{n:idCount.bad}):''):'';
  const g=$('rGap').value/10,fast=g<5;
  tm.textContent=idCount&&idCount.n?t(fast?'hTime429':'hTime',{g:g.toFixed(1)+' '+t('unit'),d:dur(idCount.n*g)}):'';
  tm.className=fast?'e':'';
}
$('count').onclick=async()=>{const r=await api.countIds();if(r.error)return accErr(r);idCount=r.result;showEst()};
$('dir').onclick=()=>api.openDir();
$('hunt').onclick=async()=>{
  if(hunting){api.stopHunt();return}
  const sel=accs.filter(a=>a.use&&!a.id),man=sel.filter(a=>a.guard&&!a.secret).length;
  if(!confirm([t('huntConfirm',{n:sel.length}),man&&t('huntManual',{n:man})].filter(Boolean).join('\n')))return;
  reset();prog=null;hunting=true;lock(true);render();
  const r=await api.hunt(tune());
  hunting=false;lock(false);
  if(r&&r.error)fail(r);
  render();
  loadAccs(); // a claim gives the account its ID
};

// account manager: the list comes without passwords, ticks decide who takes part in the next search
// column sorting: first click ascending, second descending, third back to the file order; empty values stay last
const sort={k:'',d:1};
const SORT={login:a=>a.login.toLowerCase(),steamId:a=>a.steamId,id:a=>a.id.toLowerCase()};
let V=[]; // the accounts in the order shown: ticks and Shift ranges follow what the user sees
const view=()=>{if(!sort.k)return accs;const f=SORT[sort.k];return [...accs].sort((a,b)=>{const x=f(a),y=f(b);if(!x!==!y)return x?-1:1;return sort.d*x.localeCompare(y,undefined,{numeric:true})})};
function th(k,key){
  const b=Object.assign(document.createElement('button'),{className:'s',textContent:t(key)+(sort.k===k?(sort.d>0?' ↑':' ↓'):'')});
  b.onclick=()=>{if(sort.k!==k){sort.k=k;sort.d=1}else if(sort.d>0)sort.d=-1;else sort.k='';anchor=-1;renderAcc()};
  const c=document.createElement('div');c.append(b);c.setAttribute('aria-sort',sort.k===k?(sort.d>0?'ascending':'descending'):'none');return c;
}
function renderAcc(){
  V=view();
  const box=$('mList'),keep=box.scrollTop;box.textContent='';
  const div=(c,x)=>Object.assign(document.createElement('div'),{className:c,textContent:x??''});
  if(!accs.length)box.append(div('ar none',t('mgrEmpty')));
  else{
    const h=div('ar h');h.append(div(''),th('login','login'),th('steamId','mgrSteamId'),th('id','mgrId'),div(''));box.append(h);
    for(const [i,a] of V.entries()){
      const r=div('ar'),cb=document.createElement('input');
      cb.type='checkbox';cb.checked=a.use;cb.disabled=busy;cb.setAttribute('aria-label',a.login);
      cb.onclick=e=>pick(i,e,cb.checked);
      // click on the row shows the password, Shift+click ticks a range like in a file manager
      r.onclick=e=>{if(e.target.closest('button,input'))return;if(e.shiftKey){getSelection().removeAllRanges();if(!busy)pick(i,e,!a.use)}else toggleShow(a)};
      const who=div('t',a.login),note=document.createElement('small');
      note.textContent=a.err||(a.secret?t('mgrSecret'):a.guard?t('mgrManual'):'');
      if(a.err)note.className='e';
      who.append(note);
      const clr=Object.assign(document.createElement('button'),{className:'btn sec sm',textContent:t('mgrClear'),disabled:busy||!a.id});
      clr.onclick=()=>clearOne(a);
      const del=Object.assign(document.createElement('button'),{className:'btn sec sm',textContent:t('mgrRemove'),disabled:busy});
      del.onclick=()=>removeOne(a);
      const act=div('btns');act.append(clr,del);
      r.append(cb,who,div('t m',a.steamId||'—'),div('t m',a.id?'/id/'+a.id:'—'),act);
      box.append(r);
      const s=shown.get(a.login);
      if(s){
        const d=div('ar d'),txt=div('x',t('mgrPw')+': '+s.password+(s.secret?'   shared_secret: '+s.secret:''));
        const copy=(key,what)=>{const b=Object.assign(document.createElement('button'),{className:'btn sec sm',textContent:t(key)});
          b.onclick=async()=>{const r=await api.accCopy(a.login,what);if(r.error)return accErr(r);b.textContent=t('mgrCopied');setTimeout(()=>{b.textContent=t(key)},1500)};return b};
        d.append(txt,copy('mgrCopyLogin','login'),copy('mgrCopyPw','password'));box.append(d);
      }
    }
  }
  box.scrollTop=keep;
  $('mSel').textContent=accs.length?t('mgrSel',{n:accs.filter(a=>a.use).length,m:accs.length}):'';
  ['mAll','mNone','mNoId','mAddBtn','mAddFile'].forEach(id=>$(id).disabled=busy);
  syncCfg();showEst();
  $('mRefresh').disabled=refreshing?false:busy||!accs.some(a=>a.use);
}
const shown=new Map(); // login -> {password, secret}: fetched only when the user clicks the account
const syncCfg=()=>['mImport','mFile','mExport'].forEach(id=>$(id).disabled=busy||!$('mPass').value); // the config buttons need the password first
$('mPass').addEventListener('input',syncCfg);
let anchor=-1; // the last ticked row, where a Shift range starts
const accErr=r=>r.error.key?push(r.error.key,r.error.p||{},'bad'):push('err',{},'bad',r.error.msg);
async function pick(i,e,on){
  const from=e.shiftKey&&anchor>=0?Math.min(anchor,i):i,to=e.shiftKey&&anchor>=0?Math.max(anchor,i):i;
  anchor=i;
  await api.accUse(V.slice(from,to+1).map(a=>a.login),on);
  loadAccs();
}
async function toggleShow(a){
  if(shown.has(a.login))shown.delete(a.login);
  else{const r=await api.accReveal(a.login);if(r.error)return accErr(r);shown.set(a.login,r.result)}
  renderAcc();
}
async function loadAccs(){
  const r=await api.accList();
  if(r.error)accErr(r);else accs=r.result;
  renderAcc();
}
async function clearOne(a){
  if(!confirm(t('mgrClearConfirm',{id:a.id,login:a.login})))return;
  reset();lock(true);render();
  const r=await api.accClear({login:a.login,id:a.id});
  lock(false);
  if(r&&r.error)fail(r);
  render();loadAccs();
}
async function removeOne(a){
  if(!confirm(t('mgrRemoveConfirm',{login:a.login})))return;
  const r=await api.accRemove([a.login]);
  if(r.error)accErr(r);
  shown.delete(a.login);
  loadAccs();
}
$('mAll').onclick=async()=>{await api.accUse(null,true);loadAccs()};
$('mNoId').onclick=async()=>{ // exactly the accounts that own no custom ID; the search would skip the others anyway
  await api.accUse(accs.filter(a=>a.id).map(a=>a.login),false);
  await api.accUse(accs.filter(a=>!a.id).map(a=>a.login),true);
  loadAccs();
};
$('mNone').onclick=async()=>{await api.accUse(null,false);loadAccs()};
$('mAddBtn').onclick=async()=>{
  const r=await api.accAdd($('mAdd').value);
  if(r.error)return accErr(r);
  shown.clear(); // a known login may have got a new password
  if(!r.result.bad)$('mAdd').value=''; // lines that were not understood stay, so nothing has to be typed again
  push('mgrAdded',r.result,'ok');
  if(r.result.bad)push('badAccounts',{n:r.result.bad},'bad');
  loadAccs();
};
$('mAddFile').onclick=async()=>{
  const r=await api.accAddFile();
  if(r.error)return accErr(r);
  if(!r.result)return; // the dialog was cancelled
  shown.clear();
  push('mgrAdded',r.result,'ok');
  if(r.result.bad)push('badAccounts',{n:r.result.bad},'bad');
  loadAccs();
};
$('mImport').onclick=async()=>{
  const r=await api.accImport($('mAdd').value,$('mPass').value);
  if(r.error)return accErr(r);
  shown.clear();$('mAdd').value='';
  push('mgrAdded',r.result,'ok');
  loadAccs();
};
$('mFile').onclick=async()=>{
  const r=await api.accImportFile($('mPass').value);
  if(r.error)return accErr(r);
  if(!r.result)return; // the dialog was cancelled
  shown.clear();
  push('mgrAdded',r.result,'ok');
  loadAccs();
};
$('mExport').onclick=async()=>{
  const r=await api.accExport($('mPass').value);
  if(r.error)return accErr(r);
  if(r.result)push('mgrExported',{file:r.result},'ok'); // an empty result: the user cancelled the dialog
};
$('mRefresh').onclick=async()=>{
  if(refreshing){api.stopHunt();return}
  reset();refreshing=true;lock(true);render();
  const r=await api.accRefresh();
  refreshing=false;lock(false);
  if(r&&r.error)fail(r);
  render();loadAccs();
};
render();
loadAccs();
</script></body></html>
